l_simp_chinese:
  moh_je_boxer_rebellion_completed_desc: "漢人故土已重歸控制，義和團危機由此告一段落。"
  moh_je_boxer_rebellion_failed_desc: "禁止義和團活動的條約已經生效，朝廷對義和團的支持就此終結。"
  moh_je_daoguang_reform_main_completed_desc: "道光朝的改革已在漕糧海運、礦產開採與鴉片問題上取得成果。"
  moh_je_daoguang_reform_main_failed_desc: "道光朝的改革在全部目標達成之前便已終結。"
  moh_je_xianfeng_completed_desc: "咸豐皇帝的一生與統治已告終結。"
  moh_je_xianfeng_failed_desc: "內憂外患耗盡了咸豐皇帝的心力，使其統治提前走向終結。"
  moh_je_father_of_the_republic_completed_desc: "中國重歸統一，國父成為國家的領導者。"
  moh_je_father_of_the_republic_failed_desc: "國父未及見證統一中國的理想實現，便已與世長辭。"
  moh_je_keju_failed_desc: "科舉制度已經廢除，延續千年的選官方式就此落幕。"
  moh_je_new_dynasty_completed_desc: "起事者已在建立新朝與沿用舊國號之間作出選擇。"
  moh_je_new_dynasty_failed_desc: "建立新朝的政治條件已不復存在，國號之議未及定奪便告終結。"
  moh_je_opium_obsession_completed_desc: "持續推行的禁菸政策取得成效，鴉片危機告一段落。"
  moh_je_opium_obsession_failed_desc: "外部壓力與貿易開放使維持禁菸政策的努力受挫。"
  moh_je_self_strengthing_completed_desc: "至少三項改革取得成果，洋務運動的目標已經實現。"
  moh_je_self_strengthing_failed_desc: "戰敗或地區影響力的喪失使洋務運動受挫，改革就此中斷。"
  moh_je_warlord_china_completed_desc: "改革、國際認可與主權的恢復，鞏固了國家的統一。"
  moh_je_warlord_china_failed_desc: "維繫中國統一的紐帶已經斷裂，國家陷入新一輪權力爭奪。"
  moh_je_wuxu_completed_desc: "政治、軍事與教育改革取得成果，維新派贏得了勝利。"
  moh_je_wuxu_failed_desc: "保守勢力挫敗了維新派，變法就此終結。"
  moh_je_xinhai_completed_desc: "政體變革或革命領袖的覆滅，使革命黨對舊秩序的挑戰告一段落。"
  moh_je_xinhai_failed_desc: "朝廷與政治運動之間的衝突已演變為公開的內戰。"
  je_wuxu_concluded: "維新變法"
  je_heavenly_land_system: "$law_heavenly_land_system$"
  je_heavenly_land_system_reason: "$law_heavenly_land_system_desc$"

  # 乘勝更張
  je_moh_chengsheng_gengzhang_reformed_desc: "朝廷把渡過鴉片危機的威望轉化成了改革的力量。財賦、取士與營伍的整頓已有成果，大清邁過了更張的第一道門檻。"
  je_moh_chengsheng_gengzhang_partial_desc: "更張議程終告收束。新事已經開始，舊章卻仍然支配著國家的大部分運轉。局部的改良留下了成果，未竟的事業則有待後來者繼續。"
  je_moh_chengsheng_gengzhang_unchanged_desc: "更張之議逐漸沉寂，財賦、取士與營伍未能完成預期的整頓。勝利證明了祖制的正確，至少朝堂上的人願意如此相信。"
